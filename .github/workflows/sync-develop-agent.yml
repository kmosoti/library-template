name: Verify develop-agent Ancestry

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-develop-agent:
    name: sync-develop-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch remote main and develop-agent refs
        run: git fetch origin --prune "+refs/heads/*:refs/remotes/origin/*"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify develop-agent ancestry invariants against main
        run: cargo xtask sync-branches --check
