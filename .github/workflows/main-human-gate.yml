name: Main & Maintenance Human Gate

on:
  pull_request:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  main-release-gate:
    name: main-release-gate
    runs-on: ubuntu-latest
    environment: main-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify PR commit trust-boundary and SemVer API evolution
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cargo xtask check-trust-boundary --base "origin/${BASE_REF}"
          cargo xtask check-api-surface --base "origin/${BASE_REF}"

      - name: Re-verify contract under human ratification gate
        run: cargo xtask verify --force
